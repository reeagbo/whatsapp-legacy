name: Android APK and C99 tests
# Builds are manual: the user explicitly requests each new APK/version.
on:
  workflow_dispatch:
  push:
    branches: [build-request-0.13]
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev zlib1g-dev
      - name: Test C99 core and pairing protocol
        run: bash core/build.sh
      - name: Check SQLite migration without Android
        run: python scripts/check-storage-sql.py
      - name: Probe live authenticated channel without a phone or account
        continue-on-error: true
        run: timeout 60 core/wa_probe
  apk:
    needs: core-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: |
            native-deps/armeabi-v7a
            native-deps/arm64-v8a
            native-deps/x86_64
            native-deps/signal
          key: native-ndk27-openssl3-${{ hashFiles('scripts/build-native-deps.sh', 'core/deps/*.gz') }}
      - name: Preserve development APK signing key
        uses: actions/cache@v4
        with:
          path: .signing/debug.keystore
          key: whatsapp-legacy-development-signing-v2
      - name: Create development key only when cache has none
        run: |
          if [ ! -f .signing/debug.keystore ]; then
            mkdir -p .signing
            keytool -genkeypair -keystore .signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
      - name: Build OpenSSL and prepare Signal sources
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: bash scripts/build-native-deps.sh
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Enable KVM for Android UI smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test conversation UI on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install app/build/outputs/apk/debug/whatsapp-legacy-0.13-debug.apk
            python scripts/ui-smoke.py
      - name: Upload UI verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversation-ui-smoke
          path: ui-smoke/*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp-legacy-0.13-debug
          path: app/build/outputs/apk/debug/whatsapp-legacy-*.apk
          if-no-files-found: error
          retention-days: 30
