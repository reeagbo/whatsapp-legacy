plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'org.reeagbo.whatsapplegacy'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'org.reeagbo.whatsapplegacy'
        minSdk 21
        targetSdk 35
        versionCode 28
        versionName '0.28-debug'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    signingConfigs {
        debug {
            storeFile rootProject.file('.signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { debuggable true; signingConfig signingConfigs.debug } }
}

dependencies { implementation 'com.squareup.okhttp3:okhttp:4.12.0'; testImplementation 'junit:junit:4.13.2' }

android.applicationVariants.all { variant ->
    variant.outputs.all { outputFileName = "whatsapp-legacy-${variant.versionName}.apk" }
}
